name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        mcp: ["mcp==1.21.2", "mcp>=1.21.2,<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.mcp }}"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
